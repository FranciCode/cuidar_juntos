<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Compromissos - Cuidar Juntos</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 960px; margin: 2rem auto; padding: 0 1rem; }
    table { border-collapse: collapse; width: 100%; }
    th, td { border-bottom: 1px solid #ccc; padding: .4rem; text-align: left; }
    .erro { color: #b00020; min-height: 1.2em; }
    .aviso { color: #7a5200; }
    label { display: block; margin-top: .6rem; }
    button { margin-top: .4rem; margin-right: .3rem; }
    [hidden] { display: none !important; }
  </style>
</head>
<body>
  <h1>Consultas e exames</h1>
  <p><a href="/pages/index.html">Início</a></p>

  <p class="erro" id="erro-geral" role="alert"></p>
  <button type="button" id="btn-novo" hidden>Novo compromisso</button>

  <form id="form" hidden novalidate>
    <h2 id="form-titulo"></h2>
    <label id="l-pessoa">Pessoa assistida <select id="f-pessoa"></select></label>
    <label>Tipo
      <select id="f-tipo">
        <option value="CONSULTA">Consulta</option>
        <option value="EXAME">Exame</option>
      </select>
    </label>
    <label>Data e hora <input type="datetime-local" id="f-data" required></label>
    <label>Descrição <input type="text" id="f-descricao" maxlength="250" required></label>
    <label>Observação <textarea id="f-observacao" maxlength="500" rows="3"></textarea></label>
    <p class="erro" id="erro" role="alert"></p>
    <div id="conflito" hidden>
      <p class="aviso" id="conflito-msg" role="alert"></p>
      <button type="button" id="btn-confirmar">Confirmar mesmo assim</button>
      <button type="button" id="btn-cancelar-conflito">Cancelar</button>
    </div>
    <div id="acoes-form">
      <button type="submit">Salvar</button>
      <button type="button" id="btn-cancelar-form">Cancelar</button>
    </div>
  </form>

  <p id="vazio" hidden>Nenhum compromisso cadastrado</p>
  <table id="tabela" hidden>
    <thead>
      <tr><th>Tipo</th><th>Data e hora</th><th>Descrição</th><th>Pessoa</th><th>Ações</th></tr>
    </thead>
    <tbody id="corpo"></tbody>
  </table>
  <script src="/js/compromissos.js"></script>
</body>
</html>

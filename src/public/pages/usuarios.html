<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Usuários - Cuidar Juntos</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
  <header class="topbar">
    <div class="container d-flex align-items-center justify-content-between py-3">
      <a class="brand" href="/">Cuidar<span>Juntos</span></a>
      <a class="btn btn-sm btn-outline-secondary" href="/">Voltar</a>
    </div>
  </header>
  <main class="container py-4">
    <div class="d-flex justify-content-between align-items-center mb-3">
      <h1 class="h3 mb-0">Usuários</h1>
      <button id="novoUsuario" class="btn btn-primary" type="button">Novo usuário</button>
    </div>
    <div id="tabelaMensagem" class="alert d-none" role="alert"></div>
    <div id="formCard" class="panel-card mb-4 d-none">
      <h2 id="formTitulo" class="h5">Novo usuário</h2>
      <form id="usuarioForm" class="row g-3">
        <div class="col-md-6"><label class="form-label" for="nome">Nome</label><input id="nome" class="form-control" maxlength="120" required></div>
        <div class="col-md-6"><label class="form-label" for="email">E-mail</label><input id="email" type="email" class="form-control" maxlength="190" required></div>
        <div class="col-md-4" id="senhaGrupo"><label class="form-label" for="senha">Senha (mínimo 8 caracteres)</label><input id="senha" type="password" class="form-control" minlength="8" autocomplete="new-password"></div>
        <div class="col-md-4"><label class="form-label" for="perfil">Perfil</label>
          <select id="perfil" class="form-select"><option value="COLABORADOR">Colaborador</option><option value="ADMIN">Administrador</option></select></div>
        <div class="col-md-4 d-flex align-items-end" id="permissaoGrupo">
          <div class="form-check"><input id="permissao" type="checkbox" class="form-check-input"><label class="form-check-label" for="permissao">Pode registrar administração</label></div>
        </div>
        <div class="col-12">
          <button class="btn btn-primary" type="submit">Salvar</button>
          <button id="cancelar" class="btn btn-outline-secondary" type="button">Cancelar</button>
        </div>
      </form>
      <div id="formMensagem" class="alert d-none" role="alert"></div>
    </div>
    <div class="panel-card">
      <div class="table-responsive">
        <table class="table align-middle mb-0">
          <thead><tr><th>Nome</th><th>E-mail</th><th>Perfil</th><th>Status</th><th></th></tr></thead>
          <tbody id="usuariosBody"></tbody>
        </table>
      </div>
    </div>
  </main>
  <script src="/js/usuarios.js"></script>
</body>
</html>
